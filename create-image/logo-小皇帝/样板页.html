<style>
  * { margin: 0; box-sizing: border-box }
  body { background: #000; color: #fff; font: 14px/1.6 "MiSans VF", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased }
  .wrap { max-width: 920px; margin: 0 auto; padding: 56px 36px 64px }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 22px }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: .4px }
  header .sub { color: #74747c; font-size: 12px }
  .hero { display: flex; justify-content: center; padding: 64px 0 72px }
  .hero svg { width: 372px; height: 372px; color: #fff }
  section { border-top: 1px solid rgba(255,255,255,.08); padding: 34px 0 46px }
  h2 { font-size: 12px; color: #74747c; font-weight: 400; letter-spacing: 2px; margin-bottom: 28px }
  .ladder { display: flex; align-items: flex-end; gap: 34px; padding-left: 4px }
  .ladder .item { display: flex; flex-direction: column; align-items: center; gap: 12px }
  .ladder .item span { font-size: 11px; color: #5a5a61 }
  .ladder svg { color: #fff }
  .tiles { display: flex; gap: 44px; flex-wrap: wrap; padding-left: 4px }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 14px }
  .tile > span { font-size: 12px; color: #74747c }
  .circle, .appicon, .inverse, .detail { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center }
  .circle { border-radius: 50%; background: #0c0c0e }
  .circle svg, .appicon svg, .detail svg { width: 112px; height: 112px; color: #fff }
  .appicon { border-radius: 34px; background: #0c0c0e }
  .inverse { border-radius: 18px; background: #fff; color: #111 }
  .inverse svg { width: 112px; height: 112px }
  .detail { border-radius: 18px; background: #0c0c0e }
  .detail svg { width: 150px; height: 150px }
  footer { border-top: 1px solid rgba(255,255,255,.08); padding-top: 22px; color: #74747c; font-size: 12px; line-height: 2 }
  footer b { color: #b9b9c0; font-weight: 400 }
</style>
</head>
