<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ★ 2026-10-01 补的两样（App 补深色模式那天）。
         `color-scheme`：告诉浏览器"这份文档两种模式都认"，于是**在 CSS 还没
         下载完的那一下**不会先闪一帧白底（深色模式下那一帧很扎眼）。
         `theme-color`：手机浏览器地址栏/状态栏那一圈的颜色。**必须带 media** ——
         一个值只能对应一种模式（MDN 上写明 `media` 匹配时那条才生效）。
         ⚠️ 这两个值跟的是 **App** 的底色（2026-10-03 起：浅 #f5f5f7 / 深 #151517）。
         落地页浅色那档和它**同一个值**；深色那档比它亮一档 —— 差得不多，
         地址栏和页面之间看不出接缝，所以没为它单开一套。 -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)" />

    <!-- ★ 2026-10-01 补：标题和简介**写死在 HTML 里**，不再只靠 JS 注入。
        为什么：`src/main.tsx` 是纯客户端渲染（`createRoot().render()`），
        服务端返回的 HTML 里正文是 0 个字 —— 而**社交软件的抓取器、各家 AI
        爬虫（GPTBot / ClaudeBot / PerplexityBot / Bytespider）全都不执行 JS**，
        它们看到的就是一张白纸。标签写在这儿，它们至少读得到这一页是什么。
        ★ 2026-10-04：**正文那件事已经解了** —— `npm run build` 现在会跑
        `scripts/prerender.mjs`，把落地页渲成静态 HTML 塞进 dist/index.html 的
        #root（爬虫读到 500 多字真正文），React 挂载时再接管。
        ⚠️ 所以这个文件是**开发服务器用的那份**（也是预渲染的模板）——
        改动时留意 `scripts/prerender.mjs` 里对 `<html lang="zh-CN">` 和
        `<div id="root"></div>` 这两处形状的依赖（对不上它会当场失败，不静默）。
        ⚠️ `og:url` 和 `og:image` 按规范必须是**绝对网址**，而这台机器上
        现在还没有一个正式域名（`server/` 只听 127.0.0.1）—— 等域名定了再补，
        别填一个假的进去。`og:image` 还需要一张**网址不带哈希**的封面图
        （Vite 给打包资源加的哈希每次都变），所以那一步要放到 `public/`。 -->
    <title>PinkRose —— 说句话，照片就修好了</title>
    <meta name="description" content="上传一张照片，说句话就能改：「天空再蓝一点」「后面那个人去掉」。不用装软件，打开就能用。调色在你自己手机里算，消除路人那一步才联网。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PinkRose" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="PinkRose —— 说句话，照片就修好了" />
    <meta property="og:description" content="上传一张照片，说句话就能改：「天空再蓝一点」「后面那个人去掉」。不用装软件，打开就能用。" />

    <!-- 标签页上那枚小标志（★ 2026-10-03 换的：**黑底 + 粉圆 + 侧脸剪影 + 蓝蝴蝶结**，
         用户挑的那版；原来那朵粉玫瑰他说不要了）。
         ⚠️ 现在是**位图**，不是 svg —— Safari 不认 webp 图标，所以这一处必须是 png。
         那一版是**裁到圆盘、四周只留 4% 的边**做的：图标这一档要把画占满才认得出
         （老玫瑰那版就吃过这个亏 —— 花只占画布 70%，16px 上真正有画的只有 11px，
         用户当时原话「标签页的图标太小了」）。
         图是从 `create-image/落地页/logo候选/侧脸V4-黑底粉圆+蓝结（我推荐）.png`
         裁出来的，脚本见 2026-10-03 日记。

         · `apple-touch-icon`：iOS「加到主屏幕」用的是它，而且**苹果完全不读
           `rel="icon"`** —— 少了它，主屏图标会是页面的一张截图。
           180×180 是不透明 PNG，这是苹果定的那一档。
         · 单独那个 32px 的 PNG 是给**搜索引擎**的：Google 站点图标的支持格式清单里
           没有 SVG，只有它自家的 SVG favicon 不进搜索结果。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/logo/png/profile-32.png" />
    <link rel="apple-touch-icon" href="/src/assets/logo/png/profile-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
